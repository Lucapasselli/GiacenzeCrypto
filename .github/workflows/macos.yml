name: macOS

# Costruisce i DMG per macOS (Intel e Apple Silicon) e li lascia come artifact della corsa.
#
# Non crea e non tocca nessuna release: per questo si puo' lanciare da solo (workflow_dispatch) per
# provare i pacchetti macOS senza pubblicare niente, prima di una release. release.yml lo richiama
# (workflow_call) invece di avere i passi duplicati, e poi scarica gli artifact come per gli altri job.
# Gli artifact si chiamano GiacenzeCrypto_<versione>_DMG_MacOS_<Intel|AppleSilicon>.

env:
  PROJECT_NAME: Giacenze_Crypto
  JAVA_VERSION: 25
  JAVA_DISTRIBUTION: temurin

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: Intel
          - os: macos-15
            arch: AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Scrivi la chiave del servizio prezzi
        env:
          PREZZI_API_KEY: ${{ secrets.PREZZI_API_KEY }}
        run: echo "$PREZZI_API_KEY" > src/main/resources/ServizioPrezzi_ApiKey.txt

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Setup Python virtualenv and install Pillow
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install pillow

      - name: Convert logo.png to .icns
        run: |
          source venv/bin/activate
          python3 Python/generate_icns.py
          iconutil -c icns icon.iconset -o logo.icns

      - name: Estrai versione dal pom.xml
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Versione non trovata nel pom.xml" >&2
            exit 1
          fi
          echo "VERSIONE=$VERSION" >> $GITHUB_ENV

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Moduli del runtime, controllati con jdeps (packaging/runtime/moduli.txt)
        shell: bash
        run: java packaging/runtime/ModuliRuntime.java "target/Giacenze_Crypto-${VERSIONE}-jar-with-dependencies.jar" >> "$GITHUB_ENV"

      - name: Prepare input directory for jpackage
        run: |
          mkdir -p build/Immagini
          cp -r Immagini/* build/Immagini/
          mkdir -p build/Scripts
          cp -r Scripts/* build/Scripts/
          cp logo.png build/
          cp LICENSE build/
          cp THIRD-PARTY-LICENSES.md build/
          cp target/Giacenze_Crypto-${VERSIONE}-jar-with-dependencies.jar build/Giacenze_Crypto.jar

      # Identificativo del bundle: jpackage lo ricava dal package della classe principale
      # ("com.giacenzecrypto.giacenze_crypto") e fino al JDK 24 lo accettava, cosi' le release fino alla 1.0.65
      # hanno quello. Il jpackage del JDK 25 rifiuta il trattino basso ("invalid mac bundle identifier"). Si prova
      # prima quello di sempre passato a mano, che manterrebbe l'identita' dell'app per macOS; se viene rifiutato
      # si usa il nuovo (avviso nel log). Il passo del .dmg legge l'identificativo dall'app-image.
      - name: Build macOS app-image
        run: |
          WORKDIR="HOME/Library/Application Support/GiacenzeCrypto/"
          ID_VECCHIO="com.giacenzecrypto.giacenze_crypto"
          ID_NUOVO="com.giacenzecrypto.GiacenzeCrypto"
          crea_app_image() {
            jpackage \
              --type app-image \
              --input build \
              --add-modules "$MODULI_RUNTIME" \
              --jlink-options "$OPZIONI_JLINK" \
              --dest out/appimage \
              --name ${{ env.PROJECT_NAME }} \
              --main-jar Giacenze_Crypto.jar \
              --main-class com.giacenzecrypto.giacenze_crypto.Giacenze_Crypto \
              --arguments "--workdir \"$WORKDIR\"" \
              --icon logo.icns \
              --app-version ${{ env.VERSIONE }} \
              --vendor Luca \
              --mac-package-identifier "$1"
          }
          if crea_app_image "$ID_VECCHIO"; then
            echo "::notice::jpackage ha accettato l'identificativo del bundle di sempre: $ID_VECCHIO"
          else
            echo "::warning::jpackage ha rifiutato $ID_VECCHIO, uso $ID_NUOVO (l'app cambia identita' per macOS rispetto ai DMG precedenti)"
            rm -rf out/appimage
            crea_app_image "$ID_NUOVO"
          fi

      - name: Firma ad-hoc app-image (necessaria su Intel, dove jpackage non firma di default)
        run: codesign --force --deep -s - "out/appimage/${{ env.PROJECT_NAME }}.app"

      - name: Build macOS .dmg da app-image firmato
        run: |
          ID_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "out/appimage/${{ env.PROJECT_NAME }}.app/Contents/Info.plist")
          echo "Identificativo del bundle: $ID_BUNDLE"
          jpackage \
            --type dmg \
            --app-image "out/appimage/${{ env.PROJECT_NAME }}.app" \
            --dest out/dmg \
            --name ${{ env.PROJECT_NAME }} \
            --app-version ${{ env.VERSIONE }} \
            --mac-package-identifier "$ID_BUNDLE"
          # jpackage nomina il file solo con nome+versione (Giacenze_Crypto-<versione>.dmg),
          # quindi i due job della matrice (Intel e AppleSilicon) producono lo stesso identico
          # nome file. Gli artifact restano distinti, ma in "create-release" i .dmg finiscono
          # entrambi in release_assets/ e il secondo sovrascrive il primo: nella release ne
          # comparirebbe uno solo. L'architettura va quindi messa nel nome del file.
          mv out/dmg/*.dmg "out/dmg/GiacenzeCrypto_${VERSIONE}_DMG_MacOS_${{ matrix.arch }}.dmg"

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: GiacenzeCrypto_${{ env.VERSIONE }}_DMG_MacOS_${{ matrix.arch }}
          path: out/dmg/*.dmg
