name: MSIX (Microsoft Store)

# Costruisce il pacchetto MSIX dell'EDIZIONE STORE, da caricare a mano su Partner Center.
#
# Tre cose che lo distinguono dagli altri job di release, tutte volute:
#  - compila con -Dgiacenze.edizione=store : niente scaricamento dai conti exchange e niente loghi di
#    terzi (policy 10.8.3/10.2.6 e 11.2), vedi test/Documentazione/Pubblicazione_MicrosoftStore.md;
#  - include Node e ccxt nel pacchetto invece di lasciarli scaricare all'avvio (policy 10.2.2/10.2.3);
#  - il pacchetto prodotto NON e' firmato: allo Store lo firma Microsoft, e firmarlo da se' ci mette
#    dentro un CN che non coincide con l'identita' di Partner Center. signtool compare comunque, ma
#    solo come VERIFICA di build su una copia usa e getta (vedi l'ultimo passo e la sezione 2.8 di
#    test/Documentazione/Pubblicazione_MicrosoftStore.md).
#
# Il pacchetto non viene allegato alla release pubblica: un MSIX non firmato scaricato da GitHub non
# si installa da solo, e la sua destinazione e' Partner Center.

env:
  PROJECT_NAME: Giacenze_Crypto
  JAVA_VERSION: 24
  JAVA_DISTRIBUTION: temurin
  # Deve restare allineata a CcxtInterop.NODE_VERSION: e' la stessa distribuzione che l'applicazione
  # scaricherebbe da se' negli altri pacchetti.
  NODE_VERSION: v24.7.0

# A differenza di aur.yml e flatpak.yml non c'e' nessun input "solo_prova" da cui difendersi: questo
# workflow non tocca mai la release ne' niente di pubblicato, si limita a produrre un artifact. Ogni
# esecuzione e' gia' una prova a vuoto.
on:
  workflow_dispatch:
    inputs:
      pacchetto_di_prova:
        description: "Pacchetto installabile a mano per il collaudo (NON caricabile su Partner Center)"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      pacchetto_di_prova:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # --------------------------------------------------------------------------------------------
      # Versione: quella del pom non e' un numero MSIX valido
      # --------------------------------------------------------------------------------------------
      - name: Estrai versione e calcola quella MSIX
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $versione = $pom.project.version
          if (-not $versione) { Write-Error "Versione non trovata nel pom.xml"; exit 1 }

          # MSIX vuole quattro parti numeriche senza zeri iniziali, e lo Store pretende che la quarta
          # sia 0 (se la riserva lui). La versione del progetto e' A.B.C.D con D a due cifre, quindi
          # 1.0.58.03 -> 1.0.5803.0 : cresce sia quando cresce C sia quando cresce D, che e' la sola
          # cosa che conta perche' Partner Center rifiuta un pacchetto non piu' recente del precedente.
          $p = $versione.Split('.')
          if ($p.Count -lt 3) { Write-Error "Versione '$versione' inattesa: servono almeno A.B.C"; exit 1 }
          $A = [int]$p[0]; $B = [int]$p[1]; $C = [int]$p[2]
          $D = if ($p.Count -ge 4) { [int]$p[3] } else { 0 }
          if ($D -ge 100) { Write-Error "La quarta parte della versione ($D) non puo' superare 99 : la regola A.B.(C*100+D).0 non sarebbe piu' crescente"; exit 1 }
          $versioneMsix = "$A.$B.$($C * 100 + $D).0"

          Write-Host "Versione progetto : $versione"
          Write-Host "Versione MSIX     : $versioneMsix"
          echo "VERSIONE=$versione" >> $env:GITHUB_ENV
          echo "VERSIONE_MSIX=$versioneMsix" >> $env:GITHUB_ENV

      - name: Verifica che l'identita' di Partner Center sia stata compilata
        shell: pwsh
        run: |
          # Si guardano i valori, non tutto il file: un commento che nomina i segnaposto non e' un
          # segnaposto, e una guardia che scatta sui commenti prima o poi la si disattiva.
          [xml]$manifest = Get-Content packaging\msix\AppxManifest.xml
          $id = $manifest.Package.Identity
          $valori = @($id.Name, $id.Publisher, $manifest.Package.Properties.PublisherDisplayName)
          if ($valori | Where-Object { $_ -match 'DA-COMPILARE' -or [string]::IsNullOrWhiteSpace($_) }) {
            Write-Error @"
          packaging\msix\AppxManifest.xml contiene ancora i segnaposto DA-COMPILARE.
          I tre valori si leggono in Partner Center dopo aver riservato il nome dell'applicazione
          (Product identity): Package/Identity/Name, Package/Identity/Publisher (nella forma CN=...)
          e Package/Properties/PublisherDisplayName. Non si indovinano, e dopo la creazione dell'app
          non sono piu' modificabili.
          "@
            exit 1
          }

      # --------------------------------------------------------------------------------------------
      # Build dell'edizione Store
      # --------------------------------------------------------------------------------------------
      - name: Build JAR (edizione Store)
        shell: pwsh
        # La proprieta' va VIRGOLETTATA: la shell predefinita dei runner Windows e' PowerShell, che
        # spezza -Dgiacenze.edizione=store sul punto e consegna a Maven due argomenti, il secondo dei
        # quali ".edizione=store" viene letto come fase del ciclo di vita ("Unknown lifecycle phase").
        # -DskipTests sopravvive solo perche' non contiene punti.
        run: mvn clean package -DskipTests "-Dgiacenze.edizione=store"

      - name: Verifica che il jar sia davvero l'edizione Store
        shell: pwsh
        run: |
          # Se il resource filtering non fosse passato, VarStatiche ripiegherebbe su "completa" e il
          # pacchetto conterrebbe la funzione che allo Store non puo' esserci: meglio fermarsi qui.
          $p = Get-Content target\classes\com\giacenzecrypto\giacenze_crypto\version.properties -Raw
          if ($p -notmatch 'edizione\s*=\s*store') {
            Write-Error "Il jar non e' stato costruito come edizione Store : $p"
            exit 1
          }

      - name: Prepara cartella build con risorse
        shell: pwsh
        run: |
          mkdir build\Immagini
          mkdir build\Scripts
          copy Scripts\* build\Scripts\
          copy Immagini\* build\Immagini\
          copy logo.png build\
          copy LICENSE build\
          copy THIRD-PARTY-LICENSES.md build\
          copy target\Giacenze_Crypto-$env:VERSIONE-jar-with-dependencies.jar build\Giacenze_Crypto.jar

      # --------------------------------------------------------------------------------------------
      # Node e ccxt dentro il pacchetto, invece che scaricati al primo uso
      # --------------------------------------------------------------------------------------------
      - name: Includi Node e ccxt
        shell: pwsh
        run: |
          # Il layout deve essere quello che CcxtInterop si aspetta da un Node fornito dal pacchetto:
          #   <risorse>\node\bin\node.exe        (getNodeExePath, ramo NODE_ESTERNO)
          #   <risorse>\node\node_modules\ccxt   (installCcxt esce subito se la trova; NODE_PATH ci punta)
          # Nella distribuzione ufficiale per Windows node.exe sta nella radice: si sposta qui, e il
          # Java non si tocca.
          $versioneNode = "${env:NODE_VERSION}"
          $url = "https://nodejs.org/dist/$versioneNode/node-$versioneNode-win-x64.zip"
          Write-Host "Scarico $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath nodetmp
          $dist = Join-Path (Resolve-Path nodetmp) "node-$versioneNode-win-x64"

          mkdir build\node\bin | Out-Null
          $npm = Join-Path $dist "npm.cmd"

          # npm serve solo adesso, in fase di build: a runtime, con Node fornito dal pacchetto,
          # getNpmPath() lancia apposta invece di restituire un percorso (la cartella e' di sola
          # lettura e un modulo mancante e' un difetto del pacchetto, non qualcosa da installare).
          # Si installa con la CWD dentro build\node, non con --prefix: su Windows il significato di
          # --prefix per un'installazione locale non e' quello che sembra, e qui l'unica cosa che deve
          # valere e' che ccxt finisca in build\node\node_modules SENZA portarsi dietro anche npm
          # (che nella distribuzione vive esso stesso dentro node_modules e nel pacchetto non serve).
          Push-Location build\node
          & $npm install ccxt --no-save --no-audit --no-fund --omit=dev
          if ($LASTEXITCODE -ne 0) { Write-Error "npm install ccxt fallito"; exit 1 }
          Pop-Location

          Move-Item (Join-Path $dist "node.exe") build\node\bin\node.exe

          if (-not (Test-Path build\node\bin\node.exe)) { Write-Error "node.exe non e' finito in build\node\bin"; exit 1 }
          if (-not (Test-Path build\node\node_modules\ccxt)) { Write-Error "ccxt non e' finito in build\node\node_modules"; exit 1 }

          # Del resto della distribuzione non si porta niente: node.exe per Windows e' autosufficiente.
          # "Autosufficiente" pero' e' un'assunzione, e questo e' il binario da cui dipende tutto il
          # recupero delle quotazioni: la si verifica qui invece di scoprirlo installando il pacchetto.
          $v = & build\node\bin\node.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "il node.exe incluso non parte da solo"; exit 1 }
          Write-Host "node incluso : $v"
          if ($v.Trim() -ne $versioneNode) { Write-Error "versione inattesa: $v invece di $versioneNode"; exit 1 }

          # E si verifica anche che ccxt si risolva NELLO STESSO MODO in cui lo caricera'
          # l'applicazione, cioe' con NODE_PATH puntato a <node>\node_modules (vedi CcxtInterop):
          # e' il contratto vero, non un suo surrogato.
          $env:NODE_PATH = (Resolve-Path build\node\node_modules).Path
          $esito = & build\node\bin\node.exe -e "require('ccxt'); console.log('ccxt ok')"
          if ($LASTEXITCODE -ne 0) { Write-Error "ccxt non si risolve con NODE_PATH : $esito"; exit 1 }
          Write-Host $esito
          Remove-Item Env:\NODE_PATH

          Write-Host "Node e ccxt inclusi nel pacchetto"

      # --------------------------------------------------------------------------------------------
      # App-image e pacchetto
      # --------------------------------------------------------------------------------------------
      - name: Build app-image (jpackage)
        shell: pwsh
        run: |
          # --workdir HOME/GiacenzeCrypto/ e NON AppData: le scritture di un'app impacchettata sotto
          # AppData possono finire nella LocalCache virtualizzata del pacchetto, che viene cancellata
          # alla disinstallazione. Un archivio fiscale li' dentro non ci va.
          #
          # NIENTE --risorse, ed e' la differenza piu' importante rispetto agli altri job Windows.
          # "--risorse app/" e' un percorso RELATIVO e viene risolto contro la directory di lavoro del
          # processo: sotto MSIX quella e' C:\WINDOWS\system32, non la cartella d'installazione, e il
          # programma cercava (verificato il 17/08/2026) gli script in C:\WINDOWS\system32\app\Scripts.
          # Senza l'argomento vale il comportamento predefinito di Giacenze_Crypto.main(), che ricava le
          # risorse dalla posizione del JAR (getJarPath, percorso ASSOLUTO, spazi compresi): sotto MSIX
          # e' C:\Program Files\WindowsApps\<pacchetto>\app, cioe' esattamente dove stanno Scripts/,
          # Immagini/, node/ e logo.png.
          jpackage `
            --type app-image `
            --input build `
            --dest out `
            --name $env:PROJECT_NAME `
            --main-jar Giacenze_Crypto.jar `
            --main-class com.giacenzecrypto.giacenze_crypto.Giacenze_Crypto `
            --arguments "--workdir HOME/GiacenzeCrypto/" `
            --icon logo.ico `
            --app-version $env:VERSIONE `
            --vendor Luca

      # --------------------------------------------------------------------------------------------
      # Firme Authenticode stantie lasciate da jpackage (errore 0x800700C1 in certificazione)
      # --------------------------------------------------------------------------------------------
      - name: Ripulisci le firme stantie dai PE dell'app-image
        shell: pwsh
        run: |
          # Temurin firma i propri binari da JDK 19 in avanti, compreso il lanciatore modello
          # jpackageapplauncher.exe. jpackage ne sostituisce le risorse (icona, versione, nome) SENZA
          # aggiornare la Certificates Directory del PE: il lanciatore prodotto resta con una voce di
          # firma che punta oltre la fine del file. signtool rifiuta un PE fatto cosi' con
          # ERROR_BAD_EXE_FORMAT (0x800700C1), e la firma dello Store e' proprio un signtool che
          # attraversa i PE dentro il pacchetto: la sottomissione si ferma in certificazione.
          # Vedi adoptium/adoptium-support#1305 e #1358.
          #
          # Si azzera la voce (VirtualAddress e Size) invece di rimuovere la firma con
          # "signtool remove": la firma non e' piu' valida comunque, dentro l'MSIX non serve a nessuno
          # (a firmare e' il pacchetto, non i singoli file) e cosi' non serve un signtool per farlo.
          # Si tocca SOLO chi e' rotto davvero, cioe' chi ha una voce che non finisce esattamente a
          # fine file: le DLL del runtime non sono modificate da jpackage e la loro firma Eclipse resta.
          $radice = (Resolve-Path "out\$env:PROJECT_NAME").Path
          $sistemati = 0
          $esaminati  = 0
          Get-ChildItem $radice -Recurse -File -Include *.exe,*.dll,*.sys,*.ocx,*.cpl,*.scr,*.drv | ForEach-Object {
            $fs = [System.IO.File]::Open($_.FullName, 'Open', 'ReadWrite')
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              if ($fs.Length -lt 0x40) { return }
              if ($br.ReadUInt16() -ne 0x5A4D) { return }              # "MZ"
              $fs.Position = 0x3C
              $pe = $br.ReadUInt32()
              if (($pe + 24) -ge $fs.Length) { return }
              $fs.Position = $pe
              if ($br.ReadUInt32() -ne 0x00004550) { return }          # "PE\0\0"
              $fs.Position = $pe + 24
              $magic = $br.ReadUInt16()
              # La base delle data directory dipende dal formato: 96 byte di optional header per PE32,
              # 112 per PE32+. Inchiodarne uno solo corromperebbe l'altro in silenzio.
              $off = switch ($magic) { 0x10b { 96 } 0x20b { 112 } default { $null } }
              if ($null -eq $off) { return }
              $esaminati++
              $baseDD = $pe + 24 + $off
              $fs.Position = $baseDD - 4
              if ($br.ReadUInt32() -lt 5) { return }                   # NumberOfRvaAndSizes
              $vocifirma = $baseDD + 4 * 8                             # data directory 4 = certificati
              if (($vocifirma + 8) -gt $fs.Length) { return }
              $fs.Position = $vocifirma
              $va = $br.ReadUInt32(); $dim = $br.ReadUInt32()
              if ($dim -eq 0) { return }
              # In un PE firmato regolarmente la tabella dei certificati e' in coda al file.
              if (([int64]$va + [int64]$dim) -eq $fs.Length) { return }
              Write-Host "  firma stantia: $($_.FullName.Substring($radice.Length + 1)) (voce $va+$dim, file $($fs.Length))"
              $lunghezzaPrima = $fs.Length
              $fs.Position = $vocifirma
              $fs.Write((New-Object byte[] 8), 0, 8)
              $fs.Flush()
              # Si rilegge quello che si e' appena scritto: questo passo modifica un binario che poi
              # nessun altro controlla (un PE con la voce dei certificati azzerata si firma
              # benissimo, quindi la verifica di firmabilita' in fondo NON intercetterebbe un
              # lanciatore corrotto da noi). Le uniche due cose che devono valere sono che la
              # lunghezza non sia cambiata e che gli 8 byte siano davvero a zero.
              if ($fs.Length -ne $lunghezzaPrima) { Write-Error "Riscrittura anomala di $($_.FullName): lunghezza passata da $lunghezzaPrima a $($fs.Length)"; exit 1 }
              $fs.Position = $vocifirma
              if (($br.ReadUInt32() -ne 0) -or ($br.ReadUInt32() -ne 0)) { Write-Error "Azzeramento non riuscito su $($_.FullName)"; exit 1 }
              $sistemati++
            } finally { $fs.Dispose() }
          }
          Write-Host "PE esaminati : $esaminati, firme stantie azzerate : $sistemati"
          if ($sistemati -eq 0) {
            # Non e' un errore: se una versione futura del JDK correggesse il difetto qui non ci sarebbe
            # piu' niente da fare. Ma se la certificazione dovesse fallire ancora con 0x800700C1, il
            # colpevole e' un altro e va cercato con APPXSIP_LOG=1 (vedi il passo di verifica in fondo).
            Write-Host "::warning::Nessuna firma stantia trovata: se lo Store rifiuta ancora con 0x800700C1 la causa e' un'altra"
          }

      - name: Aggiungi manifest e icone all'app-image
        shell: pwsh
        env:
          PACCHETTO_DI_PROVA: ${{ inputs.pacchetto_di_prova }}
        run: |
          $app = (Resolve-Path "out\$env:PROJECT_NAME").Path
          [xml]$manifest = Get-Content packaging\msix\AppxManifest.xml
          $manifest.Package.Identity.Version = $env:VERSIONE_MSIX

          if ($env:PACCHETTO_DI_PROVA -eq 'true') {
            # Windows rifiuta un pacchetto NON FIRMATO la cui identita' non stia nel cosiddetto
            # "spazio dei nomi non firmato" (errore 0x80073D2C): serve questo OID in coda al Publisher.
            # Cambia l'identita' del pacchetto, ed e' voluto — cosi' una copia di collaudo non puo'
            # spacciarsi per quella firmata. Per la stessa ragione l'OID NON deve esserci nel pacchetto
            # caricato su Partner Center, dove il Publisher deve coincidere con l'identita' dichiarata.
            $manifest.Package.Identity.Publisher =
              "$($manifest.Package.Identity.Publisher), OID.2.25.311729368913984317654407730594956997722=1"
            Write-Host "::warning::Pacchetto DI PROVA : identita' alterata con l'OID, NON caricabile su Partner Center"
          }

          $manifest.Save((Join-Path $app "AppxManifest.xml"))
          Copy-Item packaging\msix\Assets $app -Recurse
          Write-Host "Identity/Publisher : $($manifest.Package.Identity.Publisher)"
          echo "PUBLISHER=$($manifest.Package.Identity.Publisher)" >> $env:GITHUB_ENV
          Write-Host "Contenuto del pacchetto:"
          Get-ChildItem $app | Select-Object Name

      - name: Impacchetta con makeappx
        shell: pwsh
        env:
          PACCHETTO_DI_PROVA: ${{ inputs.pacchetto_di_prova }}
        run: |
          # makeappx.exe non e' nel PATH del runner: sta nel Windows SDK, sotto una cartella che porta
          # il numero di versione dell'SDK. Si cerca la piu' recente invece di inchiodarne una, che
          # sarebbe rotta dal primo aggiornamento dell'immagine del runner.
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
                 Where-Object { Test-Path (Join-Path $_.FullName "x64\makeappx.exe") } |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { Write-Error "makeappx.exe non trovato nel Windows SDK del runner"; exit 1 }
          $makeappx = Join-Path $sdk.FullName "x64\makeappx.exe"
          Write-Host "makeappx : $makeappx"

          mkdir pacchetto | Out-Null
          # Il nome dice cos'e': un pacchetto di prova che finisse su Partner Center verrebbe rifiutato,
          # e uno da Store non si installa a mano. Distinguerli a occhio evita di provarci.
          $suffisso = if ($env:PACCHETTO_DI_PROVA -eq 'true') { "PROVA" } else { "Store" }
          $msix = "pacchetto\GiacenzeCrypto_$($env:VERSIONE)_$suffisso.msix"
          & $makeappx pack /d "out\$env:PROJECT_NAME" /p $msix /o
          if ($LASTEXITCODE -ne 0) { Write-Error "makeappx pack fallito"; exit 1 }
          Write-Host "Pacchetto creato : $msix"
          echo "PACCHETTO=$msix" >> $env:GITHUB_ENV

      # --------------------------------------------------------------------------------------------
      # Verifica che il pacchetto sia firmabile (il giro su Partner Center dura giorni)
      # --------------------------------------------------------------------------------------------
      - name: Verifica di firmabilita' (signtool su una copia)
        shell: pwsh
        # Solo per il pacchetto da Store: su quello di prova Identity/Publisher porta in coda l'OID
        # dello spazio dei nomi non firmato, e un soggetto di certificato con un arco OID di 39 cifre
        # non e' detto che New-SelfSignedCertificate lo accetti. Il pacchetto di prova non si carica
        # da nessuna parte, quindi la sua firmabilita' non interessa a nessuno.
        if: ${{ format('{0}', inputs.pacchetto_di_prova) != 'true' }}
        run: |
          # Il pacchetto caricato resta NON firmato: lo firma lo Store. Qui si firma una COPIA usa e
          # getta, con un certificato autofirmato creato al volo, al solo scopo di far attraversare a
          # signtool gli stessi PE che attraversera' la firma dello Store. E' l'unico modo di sapere
          # PRIMA del caricamento se il pacchetto passera' quella fase: il percorso "pacchetto di
          # prova" non lo dice, perche' Add-AppxPackage -AllowUnsigned non invoca nessun signtool.
          #
          # Il soggetto del certificato deve coincidere ESATTAMENTE con Identity/Publisher del
          # manifest, altrimenti signtool si ferma prima di arrivare ai file (evento 150, 0x8007000B).
          # APPXSIP_LOG=1 fa nominare a signtool i file con la Certificates Directory malformata.
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue |
                 Where-Object { Test-Path (Join-Path $_.FullName "x64\signtool.exe") } |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { Write-Error "signtool.exe non trovato nel Windows SDK del runner"; exit 1 }
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"

          $copia = "$env:PACCHETTO.collaudo.msix"
          Copy-Item $env:PACCHETTO $copia

          $cert = New-SelfSignedCertificate -Type Custom -Subject "$env:PUBLISHER" `
                    -KeyUsage DigitalSignature -FriendlyName "Collaudo Giacenze Crypto" `
                    -CertStoreLocation "Cert:\CurrentUser\My" `
                    -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          # NB: la variabile non si chiama $pwd, che in PowerShell e' automatica (la directory corrente).
          $chiara = [guid]::NewGuid().ToString()
          $segreta = ConvertTo-SecureString -String $chiara -Force -AsPlainText
          $pfx = "collaudo.pfx"
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath $pfx -Password $segreta | Out-Null

          $env:APPXSIP_LOG = "1"
          & $signtool sign /debug /fd SHA256 /f $pfx /p $chiara $copia
          $esito = $LASTEXITCODE
          Remove-Item Env:\APPXSIP_LOG

          # Il certificato e la copia firmata non devono sopravvivere a questo passo: il pacchetto da
          # caricare e' quello NON firmato, e una copia firmata con un CN qualsiasi su Partner Center
          # verrebbe rifiutata.
          # Senza -ErrorAction: una copia FIRMATA che restasse in "pacchetto\" accanto all'artifact e'
          # esattamente cio' che non deve arrivare a Partner Center, e va saputo subito.
          Remove-Item $copia -Force
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue

          if ($esito -ne 0) {
            Write-Error "signtool non riesce a firmare il pacchetto (codice $esito). Se l'errore e' 0x800700C1 il log qui sopra nomina il file con la firma malformata."
            exit 1
          }
          Write-Host "Il pacchetto e' firmabile: la fase di firma dello Store non si fermera' su un PE malformato."

      - uses: actions/upload-artifact@v4
        with:
          name: GiacenzeCrypto_${{ env.VERSIONE }}_MSIX_${{ inputs.pacchetto_di_prova && 'PROVA' || 'Store' }}
          path: ${{ env.PACCHETTO }}

      - name: Cosa farne
        shell: pwsh
        run: |
          if ("${{ inputs.pacchetto_di_prova }}" -eq 'true') {
            Write-Host "PACCHETTO DI PROVA. Si installa su Windows 11 con PowerShell COME AMMINISTRATORE:"
            Write-Host "  Add-AppxPackage -AllowUnsigned <file>.msix"
            Write-Host "Serve l'amministratore perche' un pacchetto non firmato con contenuto eseguibile"
            Write-Host "viene installato per tutti gli utenti. NON caricarlo su Partner Center."
          } else {
            Write-Host "Il pacchetto e' l'artifact di questa esecuzione, NON e' allegato alla release."
            Write-Host "Va caricato a mano su Partner Center, non firmato: lo firma lo Store."
            Write-Host "Non si installa a mano: per provarlo rilancia con pacchetto_di_prova attivo."
          }
