name: Release

env:
  PROJECT_NAME: Giacenze_Crypto
  JAVA_VERSION: 24
  JAVA_DISTRIBUTION: temurin

on:
  workflow_dispatch:
    inputs:
      pubblica_su_aur:
        description: "Aggiorna anche il pacchetto AUR a fine release"
        type: boolean
        required: false
        # Volutamente disattivato: la prima pubblicazione va fatta a mano con aur.yml in
        # "solo_prova" (vedi test/Documentazione/Pubblicazione_AUR.md). Attivalo dopo.
        default: false
      pkgrel_aur:
        description: "pkgrel del pacchetto AUR (alzalo se ripubblichi la stessa versione)"
        required: false
        default: '1'
      pubblica_flatpak:
        description: "Allega alla release anche il bundle .flatpak"
        type: boolean
        required: false
        # Come per AUR, la prima volta conviene provarlo a mano con flatpak.yml in "solo_prova"
        # (vedi test/Documentazione/Pubblicazione_Flatpak.md). Attivalo dopo.
        default: false
      bozza:
        description: "Crea la release come bozza (draft): resta invisibile al pubblico finche' non la pubblichi a mano da GitHub, cosi' puoi scaricare e provare gli asset con calma"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # Verifica non appena parte il workflow, prima di costruire qualunque pacchetto, che "bozza"
  # non stia per collidere con una release gia' pubblicata sullo stesso tag. Il caso concreto
  # che l'ha fatta scoprire: si rilancia il workflow con "bozza" spuntata senza aver alzato la
  # versione in pom.xml, quindi il tag "Giacenze_Crypto_<versione>" e' quello di una release
  # GIA' pubblicata la settimana prima. softprops/action-gh-release trova quella release
  # esistente e la aggiorna, ma un "draft: true" su una release gia' pubblicata non la
  # ripristina in bozza in modo affidabile (verificato: gli asset restano quelli della
  # pubblicazione precedente, invariati) - il risultato e' che quanto costruito in questa corsa
  # resta comunque associato a una release pubblica gia' sincronizzata altrove (SourceForge),
  # l'esatto contrario di quello che "bozza" promette. Meglio fermarsi qui con un errore chiaro
  # che scoprirlo a valle con pacchetti gia' pubblicati.
  verifica-bozza:
    runs-on: ubuntu-latest
    if: ${{ inputs.bozza }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla che il tag di questa versione non sia gia' una release pubblicata
        run: |
          VERSION=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
          if [ -z "$VERSION" ]; then
            echo "Versione non trovata nel pom.xml" >&2
            exit 1
          fi
          TAG="Giacenze_Crypto_${VERSION}"
          # L'endpoint "releases/tags/<tag>" di GitHub non trova mai le bozze (per progetto):
          # una risposta 200 qui significa quindi sempre una release gia' pubblicata, mai una
          # bozza precedente - il caso che vogliamo bloccare, e solo quello.
          HTTP_STATUS=$(curl -s -o /tmp/release.json -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "::error::La release $TAG e' gia' pubblicata (non e' una bozza): ripartire con \"bozza\" attiva sulla stessa versione non la trasforma in bozza. Alza la versione in pom.xml prima di lanciare una release di prova."
            exit 1
          fi

  build-windows:
    needs: verifica-bozza
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Estrai versione dal pom.xml
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $version = $pom.project.version
          if (-not $version) {
            Write-Error "Versione non trovata nel pom.xml"
            exit 1
          }
          Write-Host "Versione estratta: $version"
          echo "VERSIONE=$version" >> $env:GITHUB_ENV

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Prepara cartella build con risorse
        shell: pwsh
        run: |
          mkdir build\Immagini
          mkdir build\Scripts
          copy Scripts\* build\Scripts\
          copy Immagini\* build\Immagini\
          copy logo.png build\
          copy LICENSE build\
          copy THIRD-PARTY-LICENSES.md build\
          copy target\Giacenze_Crypto-$env:VERSIONE-jar-with-dependencies.jar build\Giacenze_Crypto.jar
          mkdir out

      - name: Prepara pacchetto Portable Multipiattaforma
        shell: pwsh
        run: |
          mkdir stage\portable-multi\GiacenzeCrypto
          Copy-Item build\* stage\portable-multi\GiacenzeCrypto -Recurse

      - name: Build app-image Windows (portable)
        shell: pwsh
        run: |
          jpackage `
            --type app-image `
            --input build `
            --dest out\portable `
            --name $env:PROJECT_NAME `
            --main-jar Giacenze_Crypto.jar `
            --main-class com.giacenzecrypto.giacenze_crypto.Giacenze_Crypto `
            --arguments "--risorse app/" `
            --icon logo.ico `
            --app-version $env:VERSIONE `
            --vendor Luca

      - name: Prepara pacchetto Portable Windows
        shell: pwsh
        run: |
          mkdir stage\portable-windows\GiacenzeCrypto
          Copy-Item out\portable\$env:PROJECT_NAME\* stage\portable-windows\GiacenzeCrypto -Recurse

      - name: Build app-image Windows (per installer)
        shell: pwsh
        run: |
          jpackage `
            --type app-image `
            --input build `
            --dest installer `
            --name $env:PROJECT_NAME `
            --main-jar Giacenze_Crypto.jar `
            --main-class com.giacenzecrypto.giacenze_crypto.Giacenze_Crypto `
            --arguments "--risorse app/ --workdir HOME/AppData/Local/Programs/Giacenze_Crypto/" `
            --icon logo.ico `
            --app-version $env:VERSIONE `
            --vendor Luca

      - name: Installa Inno Setup
        run: choco install innosetup -y

      - name: Compila installer con Inno Setup
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\iscc.exe" "installer\InnoScript.iss" /DMyAppVersion="%VERSIONE%"'

      - name: Copia installer in out\
        shell: pwsh
        run: |
          copy installer\Output\Giacenze_Crypto.exe out\GiacenzeCrypto_$($env:VERSIONE)_Installer_Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GiacenzeCrypto_${{ env.VERSIONE }}_Portable_Windows
          path: stage/portable-windows

      - uses: actions/upload-artifact@v4
        with:
          name: GiacenzeCrypto_${{ env.VERSIONE }}_Portable_Multipiattaforma
          path: stage/portable-multi

      - uses: actions/upload-artifact@v4
        with:
          name: GiacenzeCrypto_${{ env.VERSIONE }}_Installer_Windows
          path: out/GiacenzeCrypto_${{ env.VERSIONE }}_Installer_Windows.exe

  build-linux:
    needs: verifica-bozza
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Estrai versione dal pom.xml
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Versione non trovata nel pom.xml" >&2
            exit 1
          fi
          echo "VERSIONE=$VERSION" >> $GITHUB_ENV

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Copy extra resources
        run: |
          mkdir -p build/Immagini
          mkdir -p build/Scripts
          cp -r Scripts/* build/Scripts/
          cp -r Immagini/* build/Immagini/
          cp logo.png build/
          cp LICENSE build/
          cp THIRD-PARTY-LICENSES.md build/
          cp target/Giacenze_Crypto-${VERSIONE}-jar-with-dependencies.jar build/Giacenze_Crypto.jar

      - name: Build Linux app-image
        run: |
          jpackage \
            --type app-image \
            --input build \
            --dest out/linux \
            --name $PROJECT_NAME \
            --main-jar Giacenze_Crypto.jar \
            --main-class com.giacenzecrypto.giacenze_crypto.Giacenze_Crypto \
            --icon logo.png \
            --app-version $VERSIONE \
            --vendor Luca

      - name: Build Debian package (.deb) with jpackage
        run: |
          WORKDIR="HOME/GiacenzeCrypto/"
          jpackage \
            --type deb \
            --input build \
            --dest out/deb \
            --name $PROJECT_NAME \
            --main-jar Giacenze_Crypto.jar \
            --main-class com.giacenzecrypto.giacenze_crypto.Giacenze_Crypto \
            --arguments "--workdir \"$WORKDIR\"" \
            --icon logo.png \
            --app-version $VERSIONE \
            --vendor Luca \
            --linux-shortcut \
            --linux-menu-group "Utility" \
            --linux-package-name giacenze-crypto \
            --linux-deb-maintainer "Luca <giacenzecrypto@gmail.com>"
          # jpackage usa la convenzione Debian per il nome file (giacenze-crypto_<versione>_amd64.deb),
          # che in "create-release" verrebbe copiato tale e quale e stonerebbe fra gli altri asset.
          # Il nome del file non ha alcun valore per dpkg/apt (i metadati stanno dentro il pacchetto,
          # e --linux-package-name resta "giacenze-crypto"), quindi si può allineare al pattern comune.
          mv out/deb/*.deb "out/deb/GiacenzeCrypto_${VERSIONE}_Deb_Linux.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: GiacenzeCrypto_${{ env.VERSIONE }}_Portable_Linux
          path: out/linux/${{ env.PROJECT_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: GiacenzeCrypto_${{ env.VERSIONE }}_Deb_Linux
          path: out/deb

  build-macos:
    needs: verifica-bozza
    if: ${{ !cancelled() && !failure() }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: Intel
          - os: macos-15
            arch: AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Setup Python virtualenv and install Pillow
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install pillow

      - name: Convert logo.png to .icns
        run: |
          source venv/bin/activate
          python3 Python/generate_icns.py
          iconutil -c icns icon.iconset -o logo.icns

      - name: Estrai versione dal pom.xml
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Versione non trovata nel pom.xml" >&2
            exit 1
          fi
          echo "VERSIONE=$VERSION" >> $GITHUB_ENV

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Prepare input directory for jpackage
        run: |
          mkdir -p build/Immagini
          cp -r Immagini/* build/Immagini/
          mkdir -p build/Scripts
          cp -r Scripts/* build/Scripts/
          cp logo.png build/
          cp LICENSE build/
          cp THIRD-PARTY-LICENSES.md build/
          cp target/Giacenze_Crypto-${VERSIONE}-jar-with-dependencies.jar build/Giacenze_Crypto.jar

      - name: Build macOS app-image
        run: |
          WORKDIR="HOME/Library/Application Support/GiacenzeCrypto/"
          jpackage \
            --type app-image \
            --input build \
            --dest out/appimage \
            --name ${{ env.PROJECT_NAME }} \
            --main-jar Giacenze_Crypto.jar \
            --main-class com.giacenzecrypto.giacenze_crypto.Giacenze_Crypto \
            --arguments "--workdir \"$WORKDIR\"" \
            --icon logo.icns \
            --app-version ${{ env.VERSIONE }} \
            --vendor Luca

      - name: Firma ad-hoc app-image (necessaria su Intel, dove jpackage non firma di default)
        run: codesign --force --deep -s - "out/appimage/${{ env.PROJECT_NAME }}.app"

      - name: Build macOS .dmg da app-image firmato
        run: |
          jpackage \
            --type dmg \
            --app-image "out/appimage/${{ env.PROJECT_NAME }}.app" \
            --dest out/dmg \
            --name ${{ env.PROJECT_NAME }} \
            --app-version ${{ env.VERSIONE }}
          # jpackage nomina il file solo con nome+versione (Giacenze_Crypto-<versione>.dmg),
          # quindi i due job della matrice (Intel e AppleSilicon) producono lo stesso identico
          # nome file. Gli artifact restano distinti, ma in "create-release" i .dmg finiscono
          # entrambi in release_assets/ e il secondo sovrascrive il primo: nella release ne
          # comparirebbe uno solo. L'architettura va quindi messa nel nome del file.
          mv out/dmg/*.dmg "out/dmg/GiacenzeCrypto_${VERSIONE}_DMG_MacOS_${{ matrix.arch }}.dmg"

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: GiacenzeCrypto_${{ env.VERSIONE }}_DMG_MacOS_${{ matrix.arch }}
          path: out/dmg/*.dmg

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Serve anche qui: senza, "mvn" gira con il JDK di default del runner (17),
      # che non riconosce le opzioni in .mvn/jvm.config e fa fallire il job.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Estrai versione dal pom.xml
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Versione non trovata nel pom.xml" >&2
            exit 1
          fi
          echo "VERSIONE=$VERSION" >> $GITHUB_ENV

      - name: Scarica tutti gli artifact delle build
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepara gli asset della release (zippa le cartelle, lascia i singoli file così come sono)
        run: |
          mkdir -p release_assets
          cd artifacts
          for d in */; do
            d="${d%/}"
            files=$(find "$d" -mindepth 1 -maxdepth 1 -type f | wc -l)
            dirs=$(find "$d" -mindepth 1 -maxdepth 1 -type d | wc -l)
            if [ "$files" -eq 1 ] && [ "$dirs" -eq 0 ]; then
              cp "$d"/* "../release_assets/"
            else
              (cd "$d" && zip -qr "../../release_assets/${d}.zip" .)
            fi
          done
          cd ..
          ls -la release_assets

      # Il nome/tag della release deve restare esattamente "Giacenze_Crypto_<VERSIONE>":
      # l'app (Funzioni.isAggiornamentoDisponibile / TransazioniCrypto_Bottone_AggiorbaVersione)
      # controlla proprio https://sourceforge.net/.../files/Giacenze_Crypto_<VERSIONE>/,
      # cartella che l'integrazione GitHub->SourceForge crea con lo stesso nome della release.
      - name: Crea la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Giacenze_Crypto_${{ env.VERSIONE }}
          name: Giacenze_Crypto_${{ env.VERSIONE }}
          files: release_assets/*
          # Una bozza non e' visibile al pubblico e non genera l'evento "release: published",
          # quindi ne' l'integrazione GitHub->SourceForge ne' un eventuale controllo aggiornamenti
          # dell'app la vedono finche' non viene pubblicata a mano dall'interfaccia GitHub.
          draft: ${{ inputs.bozza }}

  # L'aggiornamento di AUR e' richiamato qui e non con "on: release", perche' una release
  # creata col GITHUB_TOKEN di default non innesca altri workflow. Resta comunque lanciabile
  # da solo (workflow_dispatch di aur.yml) senza ricostruire e ripubblicare gli asset.
  aggiorna-aur:
    needs: create-release
    # In bozza la release non e' scaricabile pubblicamente: aur.yml fallirebbe al download
    # dell'asset, quindi il job va saltato invece che lasciato fallire.
    if: ${{ inputs.pubblica_su_aur && !inputs.bozza }}
    uses: ./.github/workflows/aur.yml
    with:
      # Ripubblicare la stessa versione produce un asset con checksum diverso (il JAR non e'
      # riproducibile): senza alzare pkgrel gli utenti non vedono l'aggiornamento.
      pkgrel: ${{ inputs.pkgrel_aur }}
    secrets: inherit

  # Stesso motivo di aggiorna-aur. Aggiunge alla release il bundle .flatpak: non ricostruisce
  # l'applicazione, riusa l'asset "Portable Multipiattaforma" appena pubblicato.
  aggiorna-flatpak:
    needs: create-release
    # Stesso motivo di aggiorna-aur: in bozza il download dell'asset dalla release fallirebbe
    # comunque (e' voluto in flatpak.yml), meglio saltare il job che lasciarlo fallire.
    if: ${{ inputs.pubblica_flatpak && !inputs.bozza }}
    uses: ./.github/workflows/flatpak.yml
    secrets: inherit
