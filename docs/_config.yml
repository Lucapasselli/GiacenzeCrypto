title: Giacenze Crypto
description: Calcolo delle giacenze e delle plusvalenze in criptovaluta per la dichiarazione dei redditi italiana
theme: jekyll-theme-minimal
lang: it
# La cartella docs/ contiene le pagine pubbliche del progetto: la documentazione (documentazione/),
