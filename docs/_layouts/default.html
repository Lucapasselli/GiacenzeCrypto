<!DOCTYPE html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} — {{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/favicon-180.png' | relative_url }}">
<script>try{var t=localStorage.getItem("gc-tema");if(t==="chiaro"||t==="scuro")document.documentElement.setAttribute("data-tema",t);}catch(e){}</script>
<link rel="stylesheet" href="{{ '/assets/css/stile.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/prosa.css' | relative_url }}">
</head>
<body>

<!-- Barra di navigazione condivisa con il sito principale (giacenzecrypto.it): stesse voci, stessi
     indirizzi assoluti. Solo la documentazione e la privacy sono ospitate qui su GitHub Pages;
     ogni altra voce torna al sito principale, così il passaggio fra i due è trasparente. -->
<header class="intestazione">
  <div class="contenitore">
    <a class="marchio" href="https://giacenzecrypto.it/">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="">
      {{ site.title }}
    </a>
    <nav class="principale">
      <a href="https://giacenzecrypto.it/#funzionalita">Funzionalità</a>
      <a href="https://giacenzecrypto.it/normative/">Normative</a>
      <a href="https://giacenzecrypto.it/api/">API prezzi</a>
      <a href="https://lucapasselli.github.io/GiacenzeCrypto/documentazione/"{% if page.url contains '/documentazione/' %} class="attivo"{% endif %}>Documentazione</a>
      <a href="https://giacenzecrypto.it/#download">Download</a>
      <a href="https://giacenzecrypto.it/#donazioni">Donazioni</a>
      <a href="https://github.com/Lucapasselli/GiacenzeCrypto">GitHub</a>
      <button class="selettore-tema" type="button" aria-label="Cambia tema chiaro/scuro" title="Cambia tema">
        <span class="icona-chiaro">☀</span><span class="icona-scuro">☾</span>
      </button>
    </nav>
  </div>
</header>

<main class="prosa">
  <div class="contenitore-prosa">
    {{ content }}
  </div>
</main>

<footer class="piede">
  <div class="contenitore">
    <span>© <span id="anno-corrente"></span> {{ site.title }} — distribuito con licenza MIT</span>
    <div class="link-piede">
      <a href="https://giacenzecrypto.it/">Home</a>
      <a href="https://giacenzecrypto.it/normative/">Normative</a>
      <a href="https://lucapasselli.github.io/GiacenzeCrypto/documentazione/">Documentazione</a>
      <a href="https://lucapasselli.github.io/GiacenzeCrypto/privacy/">Privacy</a>
      <a href="https://lucapasselli.github.io/GiacenzeCrypto/documentazione/disclaimer.html">Disclaimer</a>
      <a href="https://github.com/Lucapasselli/GiacenzeCrypto">GitHub</a>
    </div>
  </div>
</footer>

<script>document.getElementById('anno-corrente').textContent = new Date().getFullYear();</script>
<script src="{{ '/assets/js/tema.js' | relative_url }}"></script>
</body>
</html>
