<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Configurazione fontconfig del solo flatpak, agganciata dal manifest con la variabile d'ambiente
  FONTCONFIG_FILE=/app/etc/fonts/fonts.conf.

  (Attenzione: dentro un commento XML non possono comparire due trattini di fila, quindi le
  opzioni di flatpak qui sotto sono citate senza i trattini iniziali.)

  A cosa serve. L'applicazione chiede font che su Linux non esistono da nessuna parte: il default
  globale e' "Inter" (Giacenze_Crypto.DEFAULT_FONT_FAMILY) e 55 componenti generati da NetBeans
  chiedono "Segoe UI". Java non segnala nulla — new Font(...) su una famiglia assente ripiega in
  silenzio sul font logico Dialog, che a sua volta risolve in "sans-serif" via fontconfig. Il
  risultato e' che l'aspetto dell'applicazione lo decide il sans-serif predefinito del sistema.

  Fuori dal flatpak quel sans-serif e' quello dell'host: su una macchina Arch/CachyOS e' Noto Sans
  (/etc/fonts/conf.d/46-noto-sans.conf, 66-noto-sans.conf). Dentro il flatpak i font dell'host si
  vedono (sono montati in /run/host/fonts) ma l'ORDINE DI PREFERENZA e' quello del runtime
  freedesktop, dove 57-dejavu-sans.conf e 60-latin.conf mettono DejaVu Sans davanti a tutto — e il
  runtime Noto Sans non ce l'ha proprio. Misurato: "Ricalcola Plusvalenze" a 12pt occupa 118 px con
  Noto Sans e 131 px con DejaVu Sans (+11%; in grassetto 128 contro 151, +18%). Su componenti con
  setPreferredSize fisso questo e' esattamente il testo che deborda e i pulsanti disallineati.

  Percio' il manifest include i quattro TTF di Noto Sans e questo file li mette davanti. La scelta
  non e' "come sull'host di Luca" ma "sempre uguale ovunque": i font inclusi valgono anche sulle
  macchine dove Noto Sans non e' installato, dove altrimenti si tornerebbe a DejaVu.

  serif e monospace sono lasciati al runtime apposta: "serif" non e' usato da nessuna parte, e
  monospace compare in un solo punto (Download.java, la finestra di avanzamento), dove la
  differenza fra Noto Sans Mono e DejaVu Sans Mono non sposta nessun allineamento. Aggiungere un
  alias senza includere anche quei font sarebbe una riga che non fa niente.
-->
<fontconfig>
  <!-- Eredita tutto il resto dal runtime: cartelle dei font, host, cache, hinting, emoji. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!--
    Questa riga e' obbligatoria e la sua posizione pure. /app/share/fonts NON e' nel percorso di
    ricerca: il runtime freedesktop include 05-flatpak-fontpath.conf, che fa <reset-dirs /> e poi
    elenca solo /usr/share/fonts, la cartella xdg dei font e ~/.fonts. Senza dichiararla i quattro
    TTF inclusi nel pacchetto non verrebbero visti da nessuno, l'alias qui sotto ricadrebbe su
    DejaVu Sans e non se ne accorgerebbe nessuno (verificato: 25 famiglie invece di 26).

    E deve stare DOPO l'include, non prima: il <reset-dirs /> di quel file cancella le cartelle
    dichiarate fino a quel punto. Dichiarata prima, la riga non ha alcun effetto — sempre in
    silenzio.
  -->
  <dir>/app/share/fonts</dir>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
</fontconfig>
