ShortDescription: Desktop application for Italian cryptocurrency tax reporting.
Description: |-
  Giacenze Crypto is a Java desktop application for Italian crypto tax reporting.
  It tracks cryptocurrency movements across exchanges, DeFi platforms and blockchain
  wallets, calculates capital gains (plusvalenze) with the LIFO method, and produces
  the figures for the Italian tax return: Quadro RW (foreign-asset / wealth declaration)
  and Quadro RT (capital gains).
