ShortDescription: Applicazione desktop per la fiscalità italiana delle cripto-attività.
Description: |-
  Giacenze Crypto è un'applicazione desktop Java per la dichiarazione fiscale italiana
  delle cripto-attività. Traccia i movimenti su exchange, piattaforme DeFi e wallet
  on-chain, calcola le plusvalenze con il metodo LIFO e produce i dati per i quadri
  della dichiarazione dei redditi: Quadro RW (patrimonio) e Quadro RT (plusvalenze).
