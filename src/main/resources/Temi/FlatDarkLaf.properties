# Tema scuro personalizzato dell'applicazione.
#
# Viene caricato da FlatLaf grazie a FlatLaf.registerCustomDefaultsSource("Temi"), chiamata una sola
# volta in Giacenze_Crypto.main() PRIMA di installare il Look&Feel: la registrazione è globale e
# statica, quindi vale anche per il cambio tema a caldo in Principale. Senza quella chiamata questo
# file non viene letto e restano i colori di serie di FlatDarkLaf (sfondo #3c3f41, testo #bbb), cioè
# grigio su grigio con pochissimo contrasto.
#
# ATTENZIONE: le icone dell'applicazione sono monocromatiche NERE — sia i PNG di /Images sia gli SVG,
# che sono file lucide con stroke="currentColor" e che svgSalamander disegna in nero. Su questi sfondi
# sparirebbero. Vengono ridisegnate in chiaro a runtime da Icone.InizializzaTema(): abbassare ancora
# gli sfondi qui senza guardare le icone significa renderle invisibili.

#---- variabili di base ----
# Tutto il resto del tema di serie è derivato da queste due: ridefinirle qui alza il contrasto
# dell'intera interfaccia invece che di un componente per volta.
@background = #1e1e1e
@foreground = #e8e8e8

# I bordi di serie sono calcolati sul vecchio sfondo chiaro e su #1e1e1e diventano invisibili
@disabledForeground = shade(@foreground,45%)

#---- superfici ----
Panel.background = #1e1e1e
RootPane.background = #1e1e1e
window = #1a1a1a
desktop = #181818

TextField.background = #242424
TextArea.background = #242424
PasswordField.background = #242424
FormattedTextField.background = #242424
EditorPane.background = #242424
TextPane.background = #242424
TextPane.foreground = @foreground

ComboBox.background = #242424
Spinner.background = #242424
ScrollPane.background = #1e1e1e
Viewport.background = #1e1e1e

Table.background = #202020
Tree.background = #1e1e1e
List.background = #1e1e1e

TabbedPane.background = #1b1b1b
TabbedPane.selectedBackground = darken($TabbedPane.background,5%)

Button.background = #2a2a2a
Button.default.background = #3b82f6

#---- separazioni ----
# Su uno sfondo quasi nero i bordi vanno schiariti, non scuriti, altrimenti i riquadri spariscono
Component.borderColor = #4a4a4a
Component.disabledBorderColor = #383838
Separator.foreground = #3d3d3d
Table.gridColor = #383838
TableHeader.separatorColor = #4a4a4a
TableHeader.bottomSeparatorColor = #4a4a4a
