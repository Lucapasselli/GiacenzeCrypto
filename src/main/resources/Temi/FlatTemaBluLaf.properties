# Tema "Blu": variante chiara con una tavolozza blu notte e azzurro.
#
# Caricato da FlatLaf (FlatLaf.registerCustomDefaultsSource("Temi"), in Giacenze_Crypto.main) SOLO per la
# classe FlatTemaBluLaf: il tema "Chiaro" di serie (FlatLightLaf) non legge questo file e non cambia.
# Aggiunge soltanto valori di UIManager, nessun componente viene toccato.
#
# Tavolozza:
#   blu notte   #12243A   testo, barra delle schede
#   blu         #2667BC   accento, scheda selezionata
#   fondo       #F1F5FA   sfondo delle pagine
#   azzurro     #E2EDFA   fascia di identita', righe di riepilogo
#   selezione   #D9E9FB   riga o voce selezionata (chiara)
#   bordo       #DAE2EC   bordo delle schede (scurito a #C5D2E2 per i campi)
#
# ATTENZIONE: le icone dell'applicazione sono monocromatiche NERE. Questo tema e' chiaro, quindi restano
# nere (Icone.InizializzaTema(false) non fa nulla), ma la barra delle schede e' scura: nessuna scheda
# deve avere un'icona, o sparirebbe (oggi nessuna ce l'ha).

#---- variabili di base ----
@background = #F1F5FA
@foreground = #12243A
# Senza questa FlatLaf prende l'accento del sistema (macOS e Windows), e il blu cambierebbe da un PC all'altro
@accentColor = #2667BC
@accentBaseColor = #2667BC
@disabledForeground = #8A9AAE

#---- superfici ----
Panel.background = #F1F5FA
RootPane.background = #F1F5FA
ScrollPane.background = #F1F5FA
Viewport.background = #F1F5FA

TextField.background = #FFFFFF
TextArea.background = #FFFFFF
PasswordField.background = #FFFFFF
FormattedTextField.background = #FFFFFF
EditorPane.background = #FFFFFF
TextPane.background = #FFFFFF
ComboBox.background = #FFFFFF
Spinner.background = #FFFFFF
Table.background = #FFFFFF
Tree.background = #FFFFFF
List.background = #FFFFFF

Button.background = #FFFFFF
Button.default.background = #2667BC
Button.default.foreground = #FFFFFF

#---- separazioni ----
Component.borderColor = #C5D2E2
Component.disabledBorderColor = #DAE2EC
Separator.foreground = #DAE2EC
Table.gridColor = #DAE2EC
TableHeader.background = #E2EDFA
TableHeader.foreground = #12243A
TableHeader.separatorColor = #C5D2E2
TableHeader.bottomSeparatorColor = #C5D2E2

#---- schede ----
# Barra laterale e schede: striscia blu notte, voce attiva blu con testo bianco.
TabbedPane.background = #F1F5FA
TabbedPane.foreground = #DCE6F3
TabbedPane.disabledForeground = #6C819B
TabbedPane.selectedBackground = #2667BC
TabbedPane.selectedForeground = #FFFFFF
# Il passaggio del mouse schiarisce verso il blu ma resta diverso dalla scheda attiva (#2667BC): FlatLaf
# applica il colore anche alla scheda gia' selezionata, che con un grigio-blu scuro sembrerebbe spenta
TabbedPane.hoverColor = #1C4A86
TabbedPane.focusColor = #1C4A86
TabbedPane.underlineColor = #8FC0FF
TabbedPane.inactiveUnderlineColor = #8FC0FF
TabbedPane.contentAreaColor = #C5D2E2
TabbedPane.tabHeight = 34
TabbedPane.tabInsets = 5,16,5,16

#---- menu e popup ----
# Voce selezionata chiara con testo blu notte, come la riga selezionata delle tabelle
MenuItem.selectionBackground = #D9E9FB
MenuItem.selectionForeground = #12243A
Menu.selectionBackground = #D9E9FB
Menu.selectionForeground = #12243A
CheckBoxMenuItem.selectionBackground = #D9E9FB
CheckBoxMenuItem.selectionForeground = #12243A
RadioButtonMenuItem.selectionBackground = #D9E9FB
RadioButtonMenuItem.selectionForeground = #12243A

# Pulsante del titolo in alto (Principale.Bottone_Titolo): stesso blu delle fasce delle schede
Giacenze.titoloSfondo = #12243A
Giacenze.titoloTesto = #DCE6F3

# Schede come pastiglie staccate (FlatTabbedPaneBluUI): FlatLaf non ha una distanza fra le schede, la UI ridisegna lo sfondo accorciato
TabbedPaneUI = com.giacenzecrypto.giacenze_crypto.FlatTabbedPaneBluUI
TabbedPane.tabArc = 8
TabbedPane.tabSelectionArc = 8
Giacenze.tabVuoto = 3
Giacenze.tabSfondo = #12243A
